<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Kuu Blocks OG Image</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			body {
				font-family: 'Poppins', sans-serif;
				background-color: #1a1a1a;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				margin: 0;
			}
			.og-container {
				width: 1200px;
				height: 630px;
				position: relative;
				overflow: hidden;
				background: linear-gradient(
					135deg,
					#e6e8eb 0%,
					#d3dbe3 40%,
					#c2c8d3 100%
				);
			}
			.glass-card {
				background: rgba(255, 255, 255, 0.9);
				backdrop-filter: blur(10px);
				border: 1px solid rgba(255, 255, 255, 0.5);
				box-shadow:
					0 20px 25px -5px rgba(0, 0, 0, 0.1),
					0 10px 10px -5px rgba(0, 0, 0, 0.04);
			}
		</style>
	</head>
	<body>
		<div class="og-container flex flex-col justify-between p-16">
			<!-- Background Decorative Elements -->
			<div
				class="absolute top-0 right-0 h-[600px] w-[600px] translate-x-1/3 -translate-y-1/2 rounded-full bg-white opacity-20 blur-3xl"
			></div>
			<div
				class="absolute bottom-0 left-0 h-[400px] w-[400px] -translate-x-1/3 translate-y-1/3 rounded-full bg-[#e6e8eb] opacity-20 blur-3xl"
			></div>

			<!-- Content -->
			<div class="relative z-10 flex h-full max-w-2xl flex-col justify-center">
				<div class="mb-6 flex items-center gap-3">
					<div
						class="flex h-12 w-12 items-center justify-center rounded-lg bg-[#393838] text-2xl font-bold text-white"
					>
						K
					</div>
					<span
						class="text-xl font-semibold tracking-wide text-[#393838] uppercase opacity-60"
						>Shopify Theme Components</span
					>
				</div>

				<h1 class="mb-4 text-8xl leading-tight font-bold text-[#393838]">
					Kuu Blocks
				</h1>
				<p class="mb-12 text-3xl font-medium text-[#393838] opacity-80">
					Modular, accessible, and beautiful components for modern Shopify
					themes.
				</p>

				<div class="flex gap-4">
					<div
						class="rounded-full border border-white/50 bg-white/60 px-4 py-2 text-lg font-medium text-[#393838] shadow-sm"
					>
						Alpine.js
					</div>
					<div
						class="rounded-full border border-white/50 bg-white/60 px-4 py-2 text-lg font-medium text-[#393838] shadow-sm"
					>
						Tailwind CSS
					</div>
					<div
						class="rounded-full border border-white/50 bg-white/60 px-4 py-2 text-lg font-medium text-[#393838] shadow-sm"
					>
						Liquid
					</div>
				</div>
			</div>

			<!-- Visuals / Floating Cards -->
			<div
				class="absolute top-1/2 right-20 h-[500px] w-[400px] -translate-y-1/2"
			>
				<!-- Card 1: Drawer -->
				<div
					class="glass-card absolute top-0 right-0 z-10 flex h-80 w-64 rotate-6 transform flex-col overflow-hidden rounded-2xl"
				>
					<div class="h-4 border-b border-gray-200 bg-gray-100"></div>
					<div class="flex flex-col gap-3 p-4">
						<div class="h-4 w-1/2 rounded bg-gray-200"></div>
						<div class="h-24 w-full rounded bg-gray-100"></div>
						<div class="mt-auto h-8 w-full rounded bg-[#e6e8eb]"></div>
					</div>
				</div>

				<!-- Card 2: Search -->
				<div
					class="glass-card absolute top-20 right-40 z-20 flex h-40 w-72 -rotate-3 transform flex-col justify-center rounded-2xl px-6 shadow-xl"
				>
					<div
						class="flex items-center gap-3 rounded-full border border-gray-200 bg-white px-4 py-2"
					>
						<svg
							class="h-5 w-5 text-gray-400"
							fill="none"
							stroke="currentColor"
							viewBox="0 0 24 24"
						>
							<path
								stroke-linecap="round"
								stroke-linejoin="round"
								stroke-width="2"
								d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
							></path>
						</svg>
						<div class="h-2 w-24 rounded bg-gray-200"></div>
					</div>
				</div>

				<!-- Card 3: Button -->
				<div
					class="glass-card absolute right-10 bottom-10 z-30 flex h-24 w-48 rotate-12 transform items-center justify-center rounded-2xl"
				>
					<div
						class="rounded-full bg-[#393838] px-6 py-3 font-medium text-white shadow-lg"
					>
						Add to Cart
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
